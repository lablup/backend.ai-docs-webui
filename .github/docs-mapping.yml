# docs-mapping.yml
# Maps webui React source paths to documentation RST files.
# Used by scripts/analyze_changes.py to determine which docs need updating.
#
# Glob patterns are relative to the webui repo root.
# RST paths are relative to docs-webui/docs/.

meta:
  version: 1
  webui_repo: lablup/backend.ai-webui
  docs_repo: lablup/backend.ai-docs-webui

pages:
  - route: /start
    sources:
      - "react/src/pages/StartPage.tsx"
    docs:
      - "start/start.rst"

  - route: /chat
    sources:
      - "react/src/pages/ChatPage.tsx"
    docs:
      - "chat/chat.rst"

  - route: /dashboard
    sources:
