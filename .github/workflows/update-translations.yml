name: Update translations when English docs change

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.rst"
      - "!docs/locale/**"

  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated languages (default: Korean,Thai)"
        required: false
        default: "Korean,Thai"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs-webui
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-intl polib openai
          pip install -r docs/requirements.txt

      - name: Determine changed RST files
        id: changed
        run: |
          CHANGED_RST=$(git diff --name-only HEAD~1 HEAD -- 'docs/**/*.rst' ':!docs/locale/**' | tr '\n' ',' | sed 's/,$//')
          echo "files=${CHANGED_RST}" >> "$GITHUB_OUTPUT"

          if [ -z "${CHANGED_RST}" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed RST files: ${CHANGED_RST}"

      - name: Update gettext catalogs
        if: steps.changed.outputs.has_changes == 'true'
        working-directory: docs
        run: |
          sphinx-build -b gettext . _build/gettext
          sphinx-intl update -p _build/gettext -l ko -l th

      - name: Translate Korean
        if: steps.changed.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          find docs/locale/ko/LC_MESSAGES -name "*.po" -type f | while read po_file; do
            UNTRANSLATED=$(python3 -c "
          import polib
          po = polib.pofile('${po_file}')
          print(len([e for e in po if e.msgstr == '' or 'fuzzy' in e.flags]))
          ")
            if [ "${UNTRANSLATED}" -gt 0 ]; then
              echo "Translating ${po_file} (${UNTRANSLATED} entries)..."
              python translate_po.py "${po_file}" "${po_file}" --language Korean
            fi
          done

      - name: Translate Thai
        if: steps.changed.outputs.has_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          find docs/locale/th/LC_MESSAGES -name "*.po" -type f | while read po_file; do
            UNTRANSLATED=$(python3 -c "
          import polib
          po = polib.pofile('${po_file}')
          print(len([e for e in po if e.msgstr == '' or 'fuzzy' in e.flags]))
          ")
            if [ "${UNTRANSLATED}" -gt 0 ]; then
              echo "Translating ${po_file} (${UNTRANSLATED} entries)..."
              python translate_po.py "${po_file}" "${po_file}" --language Thai
            fi
          done

      - name: Create translation PR
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_WEBUI_PAT }}
        run: |
          git add docs/locale/
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi

          BRANCH_NAME="auto-translations/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "${BRANCH_NAME}"

          git config user.name "docs-automation[bot]"
          git config user.email "docs-automation[bot]@users.noreply.github.com"

          git commit -m "i18n: auto-update ko/th translations

Triggered by RST changes: ${{ steps.changed.outputs.files }}"

          git push origin "${BRANCH_NAME}"

          gh pr create \
            --draft \
            --title "i18n: auto-update ko/th translations" \
            --body "$(cat <<'EOF'
          ## Translation Update

          Auto-generated when English RST files were updated on main.

          ### Languages updated
          - [x] Korean (ko)
          - [x] Thai (th)
          - [ ] Japanese (ja) -- excluded per policy

          ### Review Checklist
          - [ ] Spot-check Korean translations for accuracy
          - [ ] Spot-check Thai translations for accuracy
          - [ ] Verify RST formatting is preserved

          ---
          *Generated using translate_po.py with GPT-4o.*
          EOF
          )"
